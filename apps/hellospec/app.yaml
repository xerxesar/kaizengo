name: hellospec
title: HelloSpec
summary: Spec-driven greetings demo (sdk/engine) — also an ACL example (own-record rules + field deny)
depends:
  - core
  - identity
  - auth
  - permissions
extensions: true
uses:
  - identity.users
  - permissions.rbac

security:
  - security.yaml

nav:
  labelKey: nav.hellospec
  route: hellospec
  order: 45

models:
  - name: greeting
    search:
      collection: hellospec.greeting
      fields: [message, mood]
    fields:
      - name: message
        type: string
        required: true
        validate:
          minLength: 1
          maxLength: 500
      - name: mood
        type: enum
        values: [happy, neutral, formal]
        required: true
        default: happy
      # Admin/staff only — member role is denied this field via security.yaml.
      - name: internalNote
        type: string

menus:
  - id: greetings
    labelKey: hellospec.menu.greetings
    children:
      - id: greeting_group
        labelKey: hellospec.menu.group
        children:
          - id: greeting_list
            labelKey: hellospec.menu.list
            view: GreetingList
          - id: greeting_new
            labelKey: hellospec.menu.new
            view: GreetingForm

locales:
  - id: en
    name: English
    dir: ltr
  - id: fa
    name: Persian
    dir: rtl
