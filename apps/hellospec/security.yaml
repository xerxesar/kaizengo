# HelloSpec ACL demo: member may call CQRS queries/commands (binary allow/deny).
# Model ACL still applies for field masking when commands write through ModelRegistry.
roles:
  - name: member
    label: Member

entries:
  - name: hellospec-member-query-list
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecGreetings

  - name: hellospec-member-query-get
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecGreeting

  - name: hellospec-member-cmd-post
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecPostGreeting

  - name: hellospec-member-cmd-revise
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecReviseGreeting

  - name: hellospec-member-cmd-discard
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecDiscardGreeting

  - name: hellospec-member-read
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [read]
    fields: [message, mood, topicId, tagIds, label, length, shout, topicName, preview]

  - name: hellospec-member-create
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [create]
    fields: [message, mood, internalNote, topicId, tagIds]

  - name: hellospec-member-update-own
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [update]
    fields: [message, mood, topicId, tagIds]
    domain: [[authorId, "=", "$user.id"]]

  - name: hellospec-member-delete-own
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [delete]
    fields: "*"
    domain: [[authorId, "=", "$user.id"]]

  - name: hellospec-member-deny-internal-note
    role: member
    effect: deny
    kind: model
    resource: hellospec.greeting
    actions: [read, update]
    fields: [internalNote]
    priority: 1000

  # Higher priority than the deny so own-record read wins; others still denied.
  - name: hellospec-member-allow-read-own-internal-note
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [read]
    fields: [internalNote]
    domain: [[authorId, "=", "$user.id"]]
    priority: 1001

  - name: hellospec-member-query-topics
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecTopics

  - name: hellospec-member-query-topic
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecTopic

  - name: hellospec-member-cmd-post-topic
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecPostTopic

  - name: hellospec-member-cmd-revise-topic
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecReviseTopic

  - name: hellospec-member-cmd-discard-topic
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecDiscardTopic

  - name: hellospec-member-topic
    role: member
    effect: allow
    kind: model
    resource: hellospec.topic
    actions: [read, create, update, delete]
    fields: "*"

  - name: hellospec-member-query-tags
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecTags

  - name: hellospec-member-query-tag
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecTag

  - name: hellospec-member-cmd-post-tag
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecPostTag

  - name: hellospec-member-cmd-revise-tag
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecReviseTag

  - name: hellospec-member-cmd-discard-tag
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecDiscardTag

  - name: hellospec-member-tag
    role: member
    effect: allow
    kind: model
    resource: hellospec.tag
    actions: [read, create, update, delete]
    fields: "*"

users:
  - email: jahan.doran@acme.example
    name: Jahan Doran
    password: member
    roles: [member]
  - email: john.doe@acme.example
    name: John Doe
    password: member
    roles: [member]
