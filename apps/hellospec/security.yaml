# HelloSpec ACL demo: member may call CQRS queries/commands (binary allow/deny).
# Model ACL still applies for field masking when commands write through ModelRegistry.
roles:
  - name: member
    label: Member

entries:
  - name: hellospec-member-query-list
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecGreetings

  - name: hellospec-member-query-get
    role: member
    effect: allow
    kind: query
    resource: hellospec.query.hellospecGreeting

  - name: hellospec-member-cmd-post
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecPostGreeting

  - name: hellospec-member-cmd-revise
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecReviseGreeting

  - name: hellospec-member-cmd-discard
    role: member
    effect: allow
    kind: command
    resource: hellospec.command.hellospecDiscardGreeting

  - name: hellospec-member-read
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [read]
    fields: [message, mood]

  - name: hellospec-member-create
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [create]
    fields: [message, mood, internalNote]

  - name: hellospec-member-update-own
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [update]
    fields: [message, mood]
    domain: [[authorId, "=", "$user.id"]]

  - name: hellospec-member-delete-own
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [delete]
    fields: "*"
    domain: [[authorId, "=", "$user.id"]]

  - name: hellospec-member-deny-internal-note
    role: member
    effect: deny
    kind: model
    resource: hellospec.greeting
    actions: [read, update]
    fields: [internalNote]
    priority: 1000

  # Higher priority than the deny so own-record read wins; others still denied.
  - name: hellospec-member-allow-read-own-internal-note
    role: member
    effect: allow
    kind: model
    resource: hellospec.greeting
    actions: [read]
    fields: [internalNote]
    domain: [[authorId, "=", "$user.id"]]
    priority: 1001

users:
  - email: jahan.doran@acme.example
    name: Jahan Doran
    password: member
    roles: [member]
  - email: john.doe@acme.example
    name: John Doe
    password: member
    roles: [member]
