name: permissions
title: Permissions
summary: Unified RBAC / ACL policies (roles, assignments, acl_entry)
depends:
  - core
  - identity
provides:
  - permissions.rbac
uses:
  - identity.users
spa: false
i18n: true
autoInstall: true
models:
  - name: role
    internal: true
    fields:
      - name: name
        type: string
        required: true
      - name: label
        type: string
        required: true
      - name: description
        type: string
      - name: active
        type: bool
        required: true
        default: true

  - name: user_role
    internal: true
    fields:
      - name: userId
        type: string
        required: true
      - name: roleId
        type: many2one
        relation: role
        required: true

  - name: acl_entry
    internal: true
    fields:
      - name: name
        type: string
        required: true
      - name: roleId
        type: many2one
        relation: role
        required: true
      - name: effect
        type: enum
        values: [allow, deny]
        required: true
        default: allow
      - name: resource
        type: string
        required: true
      - name: kind
        type: enum
        values: [model, menu, view, query, command, mutation, event, nav, app, api]
        required: true
      - name: actions
        type: json
        required: true
        default: '[]'
      - name: fields
        type: json
        required: true
        default: '"*"'
      - name: domain
        type: json
        required: true
        default: '[]'
      - name: priority
        type: int
        required: true
        default: 0
      - name: active
        type: bool
        required: true
        default: true

queries:
  - name: roles
    list: role
  - name: role
    get: role
  - name: userRoles
    list: user_role
  - name: userRole
    get: user_role
  - name: aclEntries
    list: acl_entry
  - name: aclEntry
    get: acl_entry

commands:
  - name: postRole
    create: role
  - name: reviseRole
    update: role
  - name: discardRole
    delete: role
  - name: postUserRole
    create: user_role
  - name: reviseUserRole
    update: user_role
  - name: discardUserRole
    delete: user_role
  - name: postAclEntry
    create: acl_entry
  - name: reviseAclEntry
    update: acl_entry
  - name: discardAclEntry
    delete: acl_entry

exports:
  components:
    - id: permissions.Access
      module: "@apps/permissions/views/Access.page.tsx"
    - id: permissions.Roles
      module: "@apps/permissions/views/Roles.page.tsx"

locales:
  - id: en
    name: English
    dir: ltr
  - id: fa
    name: Persian
    dir: rtl
