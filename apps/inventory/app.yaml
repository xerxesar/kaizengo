name: inventory
title: Inventory
summary: Warehouse inventory — product master, multi-UoM, locations, lot/serial traceability, and double-entry stock
depends:
  - core
  - identity
  - auth
  - permissions
provides:
  - inventory.products
  - inventory.stock
  - inventory.locations
uses:
  - identity.users
  - permissions.rbac
  - platform.i18n
nav:
  labelKey: nav.inventory
  route: inventory
  order: 40

models:
  - name: uom_group
    fields:
      - name: name
        type: string
        required: true
      - name: uoms
        type: one2many
        relation: uom
        inverse: groupId

  - name: uom
    fields:
      - name: name
        type: string
        required: true
      - name: symbol
        type: string
        required: true
      - name: groupId
        type: many2one
        relation: uom_group
        required: true
      - name: ratio
        type: number
        required: true
        default: 1
      - name: rounding
        type: number
        default: 0.000001
      - name: uomType
        type: enum
        values: [reference, bigger, smaller]
        default: reference

  - name: attribute
    search:
      collection: inventory.attribute
      fields: [name, code]
    fields:
      - name: name
        type: string
        required: true
      - name: code
        type: string
        required: true
      - name: attributeType
        type: enum
        values: [select, text, number]
        default: select
      - name: values
        type: one2many
        relation: attribute_value
        inverse: attributeId

  - name: attribute_value
    fields:
      - name: attributeId
        type: many2one
        relation: attribute
        required: true
      - name: name
        type: string
        required: true
      - name: code
        type: string
        required: true

  - name: product
    search:
      collection: inventory.product
      fields: [name, code]
    fields:
      - name: name
        type: string
        required: true
      - name: code
        type: string
        required: true
      - name: description
        type: text
      - name: category
        type: string
      - name: tracking
        type: enum
        values: [none, lot, serial, both]
        default: none
      - name: costingMethod
        type: enum
        values: [fifo, lifo, moving_average, standard]
        default: moving_average
      - name: dispatchStrategy
        type: enum
        values: [fifo, fefo, lifo]
        default: fifo
      - name: shelfLifeDays
        type: int
        default: 0
      - name: attributeSchema
        type: json
      - name: status
        type: enum
        values: [draft, active, discontinued]
        default: active
      - name: notes
        type: text
      - name: variants
        type: one2many
        relation: product_variant
        inverse: productId

  - name: product_variant
    search:
      collection: inventory.product_variant
      fields: [sku, name, upc, ean, barcode]
    fields:
      - name: productId
        type: many2one
        relation: product
        required: true
      - name: sku
        type: string
        required: true
        indexed: true
      - name: name
        type: string
        required: true
      - name: upc
        type: string
      - name: ean
        type: string
      - name: barcode
        type: string
      - name: attributes
        type: json
      - name: buyUomId
        type: many2one
        relation: uom
      - name: stockUomId
        type: many2one
        relation: uom
      - name: sellUomId
        type: many2one
        relation: uom
      - name: standardCost
        type: number
        default: 0
      - name: listPrice
        type: number
        default: 0
      - name: weight
        type: number
        default: 0
      - name: averageCost
        type: number
        default: 0
      - name: status
        type: enum
        values: [active, inactive]
        default: active

  - name: location
    search:
      collection: inventory.location
      fields: [name, code, barcode]
    fields:
      - name: name
        type: string
        required: true
      - name: code
        type: string
        required: true
        indexed: true
      - name: locationType
        type: enum
        values: [warehouse, zone, aisle, rack, shelf, bin, supplier, customer, transit, scrap, inventory, quarantine, production]
        required: true
      - name: parentId
        type: many2one
        relation: location
      - name: usage
        type: enum
        values: [internal, virtual]
        default: internal
      - name: barcode
        type: string
      - name: active
        type: bool
        default: true

  - name: stock_lot
    search:
      collection: inventory.stock_lot
      fields: [name]
    fields:
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: name
        type: string
        required: true
      - name: expiryDate
        type: date
      - name: manufacturedDate
        type: date
      - name: quantity
        type: number
        default: 0

  - name: stock_serial
    search:
      collection: inventory.stock_serial
      fields: [serial]
    fields:
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: lotId
        type: many2one
        relation: stock_lot
      - name: serial
        type: string
        required: true
        indexed: true
      - name: locationId
        type: many2one
        relation: location
      - name: status
        type: enum
        values: [available, reserved, in_transit, sold, scrapped, quarantine]
        default: available

  - name: stock_quant
    fields:
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: locationId
        type: many2one
        relation: location
        required: true
      - name: lotId
        type: many2one
        relation: stock_lot
      - name: quantity
        type: number
        default: 0
      - name: reservedQty
        type: number
        default: 0
      - name: uomId
        type: many2one
        relation: uom
      - name: unitCost
        type: number
        default: 0
      - name: value
        type: number
        default: 0

  - name: stock_ledger
    fields:
      - name: pickingId
        type: many2one
        relation: picking
      - name: moveId
        type: many2one
        relation: stock_move
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: locationId
        type: many2one
        relation: location
        required: true
      - name: lotId
        type: many2one
        relation: stock_lot
      - name: serialId
        type: many2one
        relation: stock_serial
      - name: side
        type: enum
        values: [debit, credit]
        required: true
      - name: quantity
        type: number
        required: true
      - name: uomId
        type: many2one
        relation: uom
      - name: unitCost
        type: number
        default: 0
      - name: value
        type: number
        default: 0
      - name: occurredAt
        type: datetime
      - name: memo
        type: string

  - name: cost_layer
    fields:
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: lotId
        type: many2one
        relation: stock_lot
      - name: quantity
        type: number
        default: 0
      - name: originalQty
        type: number
        default: 0
      - name: unitCost
        type: number
        default: 0
      - name: receivedAt
        type: datetime
      - name: sourceMoveId
        type: string

  - name: picking
    search:
      collection: inventory.picking
      fields: [name, origin, partnerName]
    fields:
      - name: name
        type: string
      - name: pickingType
        type: enum
        values: [incoming, outgoing, internal, return]
        required: true
      - name: state
        type: enum
        values: [draft, confirmed, assigned, done, cancelled]
        default: draft
      - name: sourceLocationId
        type: many2one
        relation: location
      - name: destLocationId
        type: many2one
        relation: location
      - name: scheduledDate
        type: datetime
      - name: doneDate
        type: datetime
      - name: origin
        type: string
      - name: partnerName
        type: string
      - name: qcStatus
        type: enum
        values: [pending, passed, failed, skipped]
        default: skipped
      - name: wave
        type: string
      - name: batch
        type: string
      - name: notes
        type: text
      - name: moves
        type: one2many
        relation: stock_move
        inverse: pickingId

  - name: stock_move
    fields:
      - name: pickingId
        type: many2one
        relation: picking
        required: true
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: fromLocationId
        type: many2one
        relation: location
      - name: toLocationId
        type: many2one
        relation: location
      - name: quantity
        type: number
        required: true
      - name: doneQty
        type: number
        default: 0
      - name: uomId
        type: many2one
        relation: uom
      - name: lotId
        type: many2one
        relation: stock_lot
      - name: serialId
        type: many2one
        relation: stock_serial
      - name: unitCost
        type: number
        default: 0
      - name: state
        type: enum
        values: [draft, done, cancelled]
        default: draft

  - name: adjustment
    fields:
      - name: name
        type: string
      - name: locationId
        type: many2one
        relation: location
        required: true
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: lotId
        type: many2one
        relation: stock_lot
      - name: reason
        type: enum
        values: [cycle_count, physical, damage, found, data_fix]
        default: cycle_count
      - name: countedQty
        type: number
        required: true
      - name: systemQty
        type: number
        default: 0
      - name: state
        type: enum
        values: [draft, confirmed, done]
        default: draft
      - name: notes
        type: text

  - name: rma
    search:
      collection: inventory.rma
      fields: [name, customerName, origin]
    fields:
      - name: name
        type: string
      - name: customerName
        type: string
        required: true
      - name: origin
        type: string
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: quantity
        type: number
        required: true
      - name: locationId
        type: many2one
        relation: location
      - name: state
        type: enum
        values: [draft, received, dispositioned, closed]
        default: draft
      - name: disposition
        type: enum
        values: [restock, repair, quarantine, scrap, credit]
        default: restock
      - name: notes
        type: text

  - name: reorder_rule
    fields:
      - name: variantId
        type: many2one
        relation: product_variant
        required: true
      - name: locationId
        type: many2one
        relation: location
      - name: method
        type: enum
        values: [min_max, safety_stock, forecast]
        default: safety_stock
      - name: minQty
        type: number
        default: 0
      - name: maxQty
        type: number
        default: 0
      - name: safetyStock
        type: number
        default: 0
      - name: leadTimeDays
        type: int
        default: 0
      - name: avgDailyDemand
        type: number
        default: 0
      - name: reorderPoint
        type: number
        default: 0
      - name: qtyToOrder
        type: number
        default: 0

  - name: iot_device
    fields:
      - name: name
        type: string
        required: true
      - name: deviceType
        type: enum
        values: [barcode_scanner, rfid_reader, mobile, mqtt_sensor, bluetooth_sensor]
        required: true
      - name: identifier
        type: string
        required: true
      - name: locationId
        type: many2one
        relation: location
      - name: status
        type: enum
        values: [online, offline, disabled]
        default: offline
      - name: config
        type: json
      - name: lastSeen
        type: datetime

  - name: integration
    fields:
      - name: name
        type: string
        required: true
      - name: kind
        type: enum
        values: [webhook, sap, netsuite, odoo, shopify, crm, custom]
        required: true
      - name: endpoint
        type: string
      - name: events
        type: json
      - name: secret
        type: string
      - name: active
        type: bool
        default: true
      - name: config
        type: json

views:
  - name: Dashboard
    type: page
  - name: Products
    type: page
  - name: Units
    type: page
  - name: Attributes
    type: page
  - name: Locations
    type: page
  - name: Stock
    type: page
  - name: Traceability
    type: page
  - name: Operations
    type: page
  - name: Receipts
    type: page
  - name: Fulfillment
    type: page
  - name: Transfers
    type: page
  - name: Adjustments
    type: page
  - name: Returns
    type: page
  - name: Planning
    type: page
  - name: Ledger
    type: page
  - name: CostLayers
    type: page
  - name: Hardware
    type: page
  - name: Integrations
    type: page

menus:
  - id: overview
    labelKey: inventory.menu.overview
    view: Dashboard
    order: 0
  - id: catalog
    labelKey: inventory.menu.catalog
    order: 10
    children:
      - id: products
        labelKey: inventory.menu.products
        view: Products
      - id: units
        labelKey: inventory.menu.units
        view: Units
      - id: attributes
        labelKey: inventory.menu.attributes
        view: Attributes
  - id: warehouse
    labelKey: inventory.menu.warehouse
    order: 20
    children:
      - id: locations
        labelKey: inventory.menu.locations
        view: Locations
      - id: stock
        labelKey: inventory.menu.stock
        view: Stock
      - id: traceability
        labelKey: inventory.menu.traceability
        view: Traceability
  - id: operations
    labelKey: inventory.menu.operations
    order: 30
    children:
      - id: all_operations
        labelKey: inventory.menu.all_operations
        view: Operations
      - id: receipts
        labelKey: inventory.menu.receipts
        view: Receipts
      - id: fulfillment
        labelKey: inventory.menu.fulfillment
        view: Fulfillment
      - id: transfers
        labelKey: inventory.menu.transfers
        view: Transfers
      - id: adjustments
        labelKey: inventory.menu.adjustments
        view: Adjustments
      - id: returns
        labelKey: inventory.menu.returns
        view: Returns
  - id: planning
    labelKey: inventory.menu.planning
    view: Planning
    order: 40
  - id: accounting
    labelKey: inventory.menu.accounting
    order: 50
    children:
      - id: ledger
        labelKey: inventory.menu.ledger
        view: Ledger
      - id: cost_layers
        labelKey: inventory.menu.cost_layers
        view: CostLayers
  - id: configuration
    labelKey: inventory.menu.configuration
    order: 60
    children:
      - id: hardware
        labelKey: inventory.menu.hardware
        view: Hardware
      - id: integrations
        labelKey: inventory.menu.integrations
        view: Integrations

locales:
  - id: en
    name: English
    dir: ltr
  - id: fa
    name: Persian
    dir: rtl
