[project]
site_name = "KaizenGo"
site_description = "Build modular operational apps on the KaizenGo platform."
site_url = "https://xerxesar.github.io/kaizengo/"
repo_url = "https://github.com/xerxesar/kaizengo"
docs_dir = "docs"
site_dir = "site"
copyright = "KaizenGo"
extra_css = ["stylesheets/fonts.css"]

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    "tutorial/index.md",
    "tutorial/run-the-platform.md",
    "tutorial/app-anatomy.md",
    "tutorial/build-an-app.md",
    "tutorial/hooks.md",
    { "Advanced" = [
      "tutorial/advanced/index.md",
      { "ORM and services" = "tutorial/advanced/orm-and-services.md" },
      { "Custom pages" = "tutorial/advanced/custom-pages.md" },
    ] },
    "tutorial/whats-next.md",
  ] },
  { "Development" = [
    "development/index.md",
    { "Workflow" = "development/workflow.md" },
    { "Platform APIs" = "development/platform.md" },
    "auth.md",
    "acl.md",
    "capabilities.md",
    "graphql.md",
    "apps.md",
    "cli.md",
    "installation.md",
    "extension-platform.md",
  ] },
  { "Reference" = [
    "internals/index.md",
    { "Go SDK" = "internals/go-sdk.md" },
    { "Solid SDK" = "internals/solid-sdk.md" },
  ] },
]

[project.theme]
custom_dir = "overrides"
# Disable Google Fonts CDN; self-hosted faces live in stylesheets/fonts.css.
font = false
logo = "assets/icon-mono.png"
favicon = "assets/icon.png"

features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.path",
  "content.code.copy",
  "toc.follow",
]
